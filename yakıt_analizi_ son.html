<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Yakıt Analizi · doğalgaz 8250 kcal/Sm³</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #0b1120 0%, #1a1f35 80%, #221c3a 100%);
            font-family: "Inter", "Plus Jakarta Sans", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #edf2fb;
        }

        .modern-card {
            width: 100%;
            max-width: 1200px; 
            background: rgba(10, 14, 30, 0.55);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 255, 255, 0.12);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            padding: 2rem 2rem;
            transition: all 0.3s ease;
        }

        @media (min-width: 1200px) {
            .modern-card {
                padding: 2.8rem 2.8rem;
            }
        }

        .hero-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.2rem;
            flex-wrap: wrap;
        }

        .hero-title h1 {
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(130deg, #ffffff, #a0e7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .hero-title span {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            filter: drop-shadow(0 0 8px #00d4ff);
        }

        .sub {
            color: #96a9d4;
            font-weight: 400;
            font-size: clamp(0.85rem, 2vw, 1rem);
            border-left: 3px solid #00d4ff;
            padding-left: 1rem;
            margin-bottom: 1.8rem;
            opacity: 0.9;
        }

        .yakit-secim {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .yakit-kategori {
            width: 100%;
            font-size: 1.2rem;
            font-weight: 600;
            color: #b0e0ff;
            margin: 0.5rem 0 0.2rem 0;
            border-bottom: 1px dashed #3b5780;
            padding-bottom: 0.2rem;
            letter-spacing: 0.3px;
        }

        .yakit-buton {
            background: rgba(6, 8, 20, 0.7);
            border: 1.5px solid #00c2ff50;
            border-radius: 2.5rem;
            padding: 0.7rem 1.4rem;
            font-weight: 600;
            color: #b7e9ff;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            box-shadow: 0 10px 18px -12px #000000;
            backdrop-filter: blur(4px);
            flex: 0 1 auto;
        }

        .yakit-buton:hover {
            border-color: #00d4ff;
            background: linear-gradient(145deg, #1f2c48, #121b30);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 20px 20px -14px #00a6ff60;
        }

        .yakit-buton.aktif {
            background: linear-gradient(145deg, #00c2ff, #0077be);
            border-color: #00a6ff;
            color: white;
            box-shadow: 0 8px 16px -8px #0077be;
        }

        .input-panel {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid #293856;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1.5rem 1.5rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .input-item {
            display: flex;
            flex-direction: column;
        }

        .input-item label {
            font-weight: 500;
            color: #a6b9e6;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .input-item input {
            padding: 0.8rem 1rem;
            border: 2px solid #2b405e;
            border-radius: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            background: #0e1424;
            color: #ffffff;
            transition: 0.2s;
            outline: none;
        }

        .input-item input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px #00d4ff30;
        }

        .param-group {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1rem;
            background: #0b1428d9;
            padding: 1.5rem 2rem;
            border-radius: 2.5rem;
            border: 1px solid #2d3b5a;
            justify-content: center;
        }

        .param-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .param-item label {
            font-weight: 600;
            color: #b8d1ff;
        }

        .param-item input {
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 2px solid #2b405e;
            background: #0e1424;
            color: white;
            width: 140px;
        }

        .param-item input:focus {
            border-color: #00d4ff;
        }

        .button-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .button-group button {
            background: linear-gradient(135deg, #00c2ff, #0066cc);
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            cursor: pointer;
            box-shadow: 0 20px 30px -14px #0066ffb0, inset 0 1px 0 #ffffff50;
            transition: 0.2s;
            border: 1px solid #00d4ff40;
            text-shadow: 0 1px 3px #00000040;
        }

        .button-group button:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 30px -10px #00a6ff;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .card-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        .card {
            background: #0b1428d9;
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 15px 30px -16px #000000;
            flex: 1 1 180px;
            border: 1px solid #00d4ff30;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .card .val {
            font-size: 2rem;
            font-weight: 700;
            color: #a9e6ff;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff, #a9e6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px #00b8ff80);
        }

        .card .unit {
            font-size: 0.9rem;
            color: #90a9da;
        }

        .card .sub-val {
            font-size: 1rem;
            font-weight: 500;
            color: #b7e9ff;
        }

        .results table {
            width: 100%;
            border-collapse: collapse;
            background: #0b1428d9;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 15px 30px -16px #000000;
            margin: 1.5rem 0;
            border: 1px solid #2d3b5a;
        }

        .results th {
            background: #10486b;
            color: #e2f0ff;
            font-weight: 500;
            padding: 1rem;
            font-size: 1rem;
            border-bottom: 1px solid #00d4ff40;
        }

        .results td {
            padding: 0.9rem 0.5rem;
            border-bottom: 1px solid #293856;
            text-align: center;
            color: #b8d1ff;
        }

        .results .highlight {
            background: #1f2c48;
            font-weight: 500;
        }

        .note {
            background: #0d1c2b60;
            border-left: 8px solid #00d4ff;
            border-radius: 1.5rem;
            padding: 1.2rem 2rem;
            font-style: italic;
            margin: 2rem 0;
            color: #b8d1ff;
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            color: #61759e;
            font-size: 0.8rem;
            border-top: 1px dashed #2e3b5a;
            padding-top: 1.5rem;
        }

        .results h2, .results h3 {
            color: #a0e7ff;
            margin: 1rem 0 1rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            border-left: 4px solid #00d4ff;
            padding-left: 1rem;
        }

        .results h2 { font-size: 1.6rem; }
        .results h3 { font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="hero-title">
            <span>🔥</span>
            <h1>yakıt analizi</h1>
        </div>
        <div class="sub">katı · sıvı · gaz | tüm hacimsel sonuçlar Sm³ cinsindendir</div>

        <!-- YAKIT SEÇİM BUTONLARI -->
        <div class="yakit-secim">
            <div class="yakit-kategori">⚫ Katı yakıtlar</div>
            <button class="yakit-buton" data-yakit="taskomuru">Taşkömürü</button>
            <button class="yakit-buton" data-yakit="linyit">Linyit</button>
            <button class="yakit-buton" data-yakit="antrasit">Antrasit</button>
            <button class="yakit-buton" data-yakit="petrokok">Petrokok</button>
            <button class="yakit-buton" data-yakit="odun_peleti">Odun peleti</button>

            <div class="yakit-kategori">🔵 Sıvı yakıtlar</div>
            <button class="yakit-buton" data-yakit="agir_fuel_oil">Ağır fuel oil</button>
            <button class="yakit-buton" data-yakit="hafif_fuel_oil">Hafif fuel oil</button>
            <button class="yakit-buton" data-yakit="dizel">Dizel</button>
            <button class="yakit-buton" data-yakit="atik_yag">Atık yağ</button>

            <div class="yakit-kategori">🟢 Gaz yakıtlar</div>
            <button class="yakit-buton" data-yakit="dogalgaz_yuksek">Doğalgaz (yüksek kal.)</button>
            <button class="yakit-buton" data-yakit="dogalgaz_dusuk">Doğalgaz (standart 8250)</button>
            <button class="yakit-buton" data-yakit="lpg">LPG (propan/bütan)</button>
            <button class="yakit-buton" data-yakit="propan">Propan</button>
            <button class="yakit-buton" data-yakit="butan">Bütan</button>
            <button class="yakit-buton" data-yakit="biyogaz">Biyogaz (%60 CH₄)</button>
        </div>

        <!-- Elementel analiz paneli -->
        <div class="input-panel">
            <div class="input-item"><label>Karbon C (%)</label><input type="number" id="yakit_c" step="0.1" value="76.5"></div>
            <div class="input-item"><label>Hidrojen H (%)</label><input type="number" id="yakit_h" step="0.1" value="18.5"></div>
            <div class="input-item"><label>Oksijen O (%)</label><input type="number" id="yakit_o" step="0.1" value="0"></div>
            <div class="input-item"><label>Azot N (%)</label><input type="number" id="yakit_n" step="0.1" value="5.0"></div>
            <div class="input-item"><label>Kükürt S (%)</label><input type="number" id="yakit_s" step="0.1" value="0"></div>
            <div class="input-item"><label>Nem W (%)</label><input type="number" id="yakit_w" step="0.1" value="0"></div>
            <div class="input-item"><label>Kül (%)</label><input type="number" id="yakit_kul" step="0.1" value="0"></div>
            
            <div class="param-group">
                <div class="param-item"><label>Hava fazlalık katsayısı λ :</label><input type="number" id="yakit_lambda" min="0.7" max="1.6" step="0.01" value="1.20"></div>
                <div class="param-item"><label>Yoğunluk (kg/Nm³) :</label><input type="number" id="yakit_yogunluk" step="0.001" value="0.750" placeholder="0 = sıvı/katı"></div>
            </div>
            
            <div class="button-group">
                <button id="hesaplaYakitAnalizi">🔬 HESAPLA</button>
            </div>
        </div>

        <!-- SONUÇLAR -->
        <div class="results" id="yakitSonuclar"></div>

        <footer>
            ⚙️ Dönüşüm: 1 kJ/kg = 0.23885 kcal/kg &nbsp; | &nbsp; 1 Nm³ = 1,055 Sm³ (15°C) &nbsp; | &nbsp; kcal/Sm³ = kcal/kg × (kg/Nm³) × (273,15/288,15)
        </footer>
    </div>

    <script>
        (function() {
            // YAKIT VERİTABANI (toplam = 100)
            const yakitlar = {
                // Katı
                taskomuru:   { C:70.0, H:5.0, O:8.0, N:1.0, S:1.0, W:10.0, kul:5.0, yogunluk:0 },
                linyit:      { C:40.0, H:3.0, O:12.0, N:0.5, S:2.0, W:30.0, kul:12.5, yogunluk:0 },
                antrasit:    { C:85.0, H:3.0, O:2.0, N:0.5, S:0.5, W:5.0, kul:4.0, yogunluk:0 },
                petrokok:    { C:88.0, H:3.0, O:2.0, N:1.0, S:4.0, W:1.0, kul:1.0, yogunluk:0 },
                odun_peleti: { C:45.0, H:6.0, O:40.0, N:0.1, S:0.05, W:8.0, kul:0.85, yogunluk:0 },
                // Sıvı
                agir_fuel_oil:  { C:86.0, H:11.0, O:0.5, N:0.5, S:2.0, W:0, kul:0, yogunluk:0 },
                hafif_fuel_oil: { C:87.0, H:12.0, O:0.2, N:0.1, S:0.5, W:0, kul:0.2, yogunluk:0 },
                dizel:          { C:86.5, H:13.2, O:0, N:0, S:0.3, W:0, kul:0, yogunluk:0 },
                atik_yag:       { C:80.0, H:10.0, O:5.0, N:0.5, S:1.0, W:2.0, kul:1.5, yogunluk:0 },
                // Gaz
                dogalgaz_yuksek: { C:74.0, H:24.5, O:0, N:1.5, S:0, W:0, kul:0, yogunluk:0.750 },
                dogalgaz_dusuk:  { C:76.5, H:18.5, O:0, N:5.0, S:0, W:0, kul:0, yogunluk:0.750 },
                lpg:            { C:82.1, H:17.9, O:0, N:0, S:0, W:0, kul:0, yogunluk:2.150 },
                propan:         { C:81.8, H:18.2, O:0, N:0, S:0, W:0, kul:0, yogunluk:1.964 },
                butan:          { C:82.7, H:17.3, O:0, N:0, S:0, W:0, kul:0, yogunluk:2.588 },
                biyogaz:        { C:55.9, H:15.0, O:29.1, N:0, S:0, W:0, kul:0, yogunluk:1.214 }
            };

            const cInp = document.getElementById('yakit_c');
            const hInp = document.getElementById('yakit_h');
            const oInp = document.getElementById('yakit_o');
            const nInp = document.getElementById('yakit_n');
            const sInp = document.getElementById('yakit_s');
            const wInp = document.getElementById('yakit_w');
            const kulInp = document.getElementById('yakit_kul');
            const lambdaInp = document.getElementById('yakit_lambda');
            const yogunlukInp = document.getElementById('yakit_yogunluk');
            const hesaplaBtn = document.getElementById('hesaplaYakitAnalizi');
            const sonuclarDiv = document.getElementById('yakitSonuclar');
            const yakitButonlari = document.querySelectorAll('.yakit-buton');

            // DÜZELTİLMİŞ DÖNÜŞÜM: Nm³ -> Sm³ (1 Nm³ = 1.055 Sm³ olduğundan, Nm³ değerini Sm³'e çevirmek için 1.055 ile çarparız.
            // Ancak hacimsel ısıl değer kcal/Sm³ = kcal/kg * (kg/Nm³) * (273.15/288.15) olduğundan, buradaki faktör 0.948'dir.
            // Kod karmaşasını önlemek için iki farklı sabit tanımlıyoruz:
            const Nm3_per_Sm3 = 273.15 / 288.15; // ≈0.948 (1 Sm³ = 1/Nm3_per_Sm3 Nm³)
            const Sm3_per_Nm3 = 288.15 / 273.15; // ≈1.055

            // Yakıt butonları
            yakitButonlari.forEach(btn => {
                btn.addEventListener('click', function() {
                    yakitButonlari.forEach(b => b.classList.remove('aktif'));
                    this.classList.add('aktif');
                    const yakit = this.dataset.yakit;
                    const veri = yakitlar[yakit];
                    if (!veri) return;

                    cInp.value = veri.C.toFixed(1);
                    hInp.value = veri.H.toFixed(1);
                    oInp.value = veri.O.toFixed(1);
                    nInp.value = veri.N.toFixed(1);
                    sInp.value = veri.S.toFixed(1);
                    wInp.value = veri.W.toFixed(1);
                    kulInp.value = veri.kul.toFixed(1);
                    yogunlukInp.value = veri.yogunluk.toFixed(3);
                });
            });

            hesaplaBtn.addEventListener('click', yakitAnaliziHesapla);

            function yakitAnaliziHesapla() {
                let C = parseFloat(cInp.value) || 0;
                let H = parseFloat(hInp.value) || 0;
                let O = parseFloat(oInp.value) || 0;
                let N = parseFloat(nInp.value) || 0;
                let S = parseFloat(sInp.value) || 0;
                let W = parseFloat(wInp.value) || 0;
                let kul = parseFloat(kulInp.value) || 0;
                let lambda = parseFloat(lambdaInp.value) || 1.2;
                let yogunluk = parseFloat(yogunlukInp.value) || 0;

                let toplam = C + H + O + N + S + W + kul;
                if (Math.abs(toplam - 100) > 0.5) {
                    alert("Toplam yüzde 100 olmalıdır! Şu an toplam: " + toplam.toFixed(1));
                    return;
                }

                let c = C/100, h = H/100, o = O/100, n = N/100, s = S/100, w = W/100;

                // Isıl değerler (kJ/kg)
                let HHV_kJ = 338.3*C + 1443*(H - O/8) + 94.2*S;
                let LHV_kJ = HHV_kJ - 24.44*(9*H + W);
                let HHV_MJ = HHV_kJ / 1000;
                let LHV_MJ = LHV_kJ / 1000;
                let ORT_MJ = (HHV_MJ + LHV_MJ) / 2;
                let HHV_kcal_kg = HHV_kJ * 0.23885;
                let LHV_kcal_kg = LHV_kJ * 0.23885;
                let ORT_kcal_kg = (HHV_kcal_kg + LHV_kcal_kg) / 2;

                // Hacimsel ısıl değerler (kcal/Sm³) - doğru dönüşüm
                let HHV_kcal_Sm3 = yogunluk > 0 ? HHV_kcal_kg * yogunluk * Nm3_per_Sm3 : null;
                let LHV_kcal_Sm3 = yogunluk > 0 ? LHV_kcal_kg * yogunluk * Nm3_per_Sm3 : null;
                let ORT_kcal_Sm3 = yogunluk > 0 ? (HHV_kcal_Sm3 + LHV_kcal_Sm3) / 2 : null;

                // Stokiyometrik oksijen ve hava (Nm³/kg)
                let O2_teo_Nm3 = 1.867*c + 5.6*(h - o/8) + 0.7*s;
                let hava_teo_Nm3 = O2_teo_Nm3 / 0.21;
                let hava_gercek_Nm3 = lambda * hava_teo_Nm3;
                let O2_gercek_Nm3 = lambda * O2_teo_Nm3;

                let V_CO2_tam_Nm3 = 1.867 * c;
                let V_SO2_Nm3 = 0.7 * s;
                let V_H2O_Nm3 = (9*h + w) * 1.244;
                let V_N2_yakit_Nm3 = n * 0.8;

                let O2_H = 5.6 * (h - o/8);
                let O2_S = 0.7 * s;
                let O2_H_S = O2_H + O2_S;
                let O2_kalan_C = O2_gercek_Nm3 - O2_H_S;

                let V_CO2_Nm3, V_CO_Nm3, V_O2_artik_Nm3, V_N2_hava_Nm3;
                let eksikYanma = false;

                if (O2_kalan_C >= V_CO2_tam_Nm3) {
                    V_CO2_Nm3 = V_CO2_tam_Nm3;
                    V_CO_Nm3 = 0;
                    V_O2_artik_Nm3 = O2_kalan_C - V_CO2_tam_Nm3;
                } else {
                    eksikYanma = true;
                    let x = 2*O2_kalan_C - V_CO2_tam_Nm3;
                    let y = V_CO2_tam_Nm3 - x;
                    if (x < 0) x = 0;
                    if (y < 0) y = 0;
                    V_CO2_Nm3 = x;
                    V_CO_Nm3 = y;
                    V_O2_artik_Nm3 = 0;
                }

                V_N2_hava_Nm3 = 0.79 * hava_gercek_Nm3;
                let V_N2_Nm3 = V_N2_hava_Nm3 + V_N2_yakit_Nm3;

                let toplam_yas_Nm3 = V_CO2_Nm3 + V_SO2_Nm3 + V_H2O_Nm3 + V_N2_Nm3 + V_O2_artik_Nm3 + V_CO_Nm3;
                let toplam_kuru_Nm3 = V_CO2_Nm3 + V_SO2_Nm3 + V_N2_Nm3 + V_O2_artik_Nm3 + V_CO_Nm3;

                // Tüm hacimleri Sm³'e çevir (Nm³ * Sm3_per_Nm3)
                let O2_teo_Sm3 = O2_teo_Nm3 * Sm3_per_Nm3;
                let hava_teo_Sm3 = hava_teo_Nm3 * Sm3_per_Nm3;
                let hava_gercek_Sm3 = hava_gercek_Nm3 * Sm3_per_Nm3;
                let V_CO2_Sm3 = V_CO2_Nm3 * Sm3_per_Nm3;
                let V_SO2_Sm3 = V_SO2_Nm3 * Sm3_per_Nm3;
                let V_H2O_Sm3 = V_H2O_Nm3 * Sm3_per_Nm3;
                let V_N2_Sm3 = V_N2_Nm3 * Sm3_per_Nm3;
                let V_O2_artik_Sm3 = V_O2_artik_Nm3 * Sm3_per_Nm3;
                let V_CO_Sm3 = V_CO_Nm3 * Sm3_per_Nm3;
                let toplam_yas_Sm3 = toplam_yas_Nm3 * Sm3_per_Nm3;
                let toplam_kuru_Sm3 = toplam_kuru_Nm3 * Sm3_per_Nm3;

                function yuzde(hacim, toplam) {
                    return toplam > 0 ? (hacim / toplam * 100).toFixed(2) : "0.00";
                }

                // ISIL DEĞER KARTLARI
                let html = `
                    <h2>📊 Isıl Değerler</h2>
                    <div class="card-row">
                        <div class="card"><span class="val">${HHV_MJ.toFixed(3)}</span> <span class="unit">MJ/kg</span><br>Üst Isıl Değer</div>
                        <div class="card"><span class="val">${LHV_MJ.toFixed(3)}</span> <span class="unit">MJ/kg</span><br>Alt Isıl Değer</div>
                        <div class="card"><span class="val">${ORT_MJ.toFixed(3)}</span> <span class="unit">MJ/kg</span><br>Ortalama</div>
                    </div>
                    <div class="card-row">
                        <div class="card"><span class="val">${HHV_kcal_kg.toFixed(0)}</span> <span class="unit">kcal/kg</span><br>Üst Isıl Değer</div>
                        <div class="card"><span class="val">${LHV_kcal_kg.toFixed(0)}</span> <span class="unit">kcal/kg</span><br>Alt Isıl Değer</div>
                        <div class="card"><span class="val">${ORT_kcal_kg.toFixed(0)}</span> <span class="unit">kcal/kg</span><br>Ortalama</div>
                    </div>
                `;

                if (yogunluk > 0) {
                    html += `
                    <h3>Hacimsel Isıl Değerler (Sm³)</h3>
                    <div class="card-row">
                        <div class="card"><span class="val">${HHV_kcal_Sm3.toFixed(0)}</span> <span class="unit">kcal/Sm³</span><br>Üst Isıl Değer</div>
                        <div class="card"><span class="val">${LHV_kcal_Sm3.toFixed(0)}</span> <span class="unit">kcal/Sm³</span><br>Alt Isıl Değer</div>
                        <div class="card"><span class="val">${ORT_kcal_Sm3.toFixed(0)}</span> <span class="unit">kcal/Sm³</span><br>Ortalama</div>
                    </div>
                    `;
                } else {
                    html += `<div class="note">🔔 Hacimsel ısıl değerler (kcal/Sm³) için yakıt yoğunluğu giriniz.</div>`;
                }

                // HAVA MİKTARLARI
                html += `
                    <h2>🌬️ Hava Miktarları (Sm³/kg)</h2>
                    <div class="card-row">
                        <div class="card">
                            <span class="val">${O2_teo_Sm3.toFixed(3)}</span> <span class="unit">Sm³/kg</span><br>Teorik O₂
                        </div>
                        <div class="card">
                            <span class="val">${hava_teo_Sm3.toFixed(3)}</span> <span class="unit">Sm³/kg</span><br>Teorik Hava
                        </div>
                        <div class="card">
                            <span class="val">${hava_gercek_Sm3.toFixed(3)}</span> <span class="unit">Sm³/kg</span><br>Gerçek Hava
                        </div>
                    </div>

                    <h2>🔥 Yanma Ürünleri (λ = ${lambda})</h2>
                    <table>
                        <tr>
                            <th>Bileşen</th>
                            <th>Hacim (Sm³/kg)</th>
                            <th>Yaş baz (%)</th>
                            <th>Kuru baz (%)</th>
                        </tr>
                        <tr><td>CO₂</td><td>${V_CO2_Sm3.toFixed(4)}</td><td>${yuzde(V_CO2_Sm3, toplam_yas_Sm3)}</td><td>${yuzde(V_CO2_Sm3, toplam_kuru_Sm3)}</td></tr>
                        <tr><td>SO₂</td><td>${V_SO2_Sm3.toFixed(4)}</td><td>${yuzde(V_SO2_Sm3, toplam_yas_Sm3)}</td><td>${yuzde(V_SO2_Sm3, toplam_kuru_Sm3)}</td></tr>
                        <tr><td>H₂O (buhar)</td><td>${V_H2O_Sm3.toFixed(4)}</td><td>${yuzde(V_H2O_Sm3, toplam_yas_Sm3)}</td><td>-</td></tr>
                        <tr><td>N₂</td><td>${V_N2_Sm3.toFixed(4)}</td><td>${yuzde(V_N2_Sm3, toplam_yas_Sm3)}</td><td>${yuzde(V_N2_Sm3, toplam_kuru_Sm3)}</td></tr>
                        <tr><td>O₂ (artık)</td><td>${V_O2_artik_Sm3.toFixed(4)}</td><td>${yuzde(V_O2_artik_Sm3, toplam_yas_Sm3)}</td><td>${yuzde(V_O2_artik_Sm3, toplam_kuru_Sm3)}</td></tr>
                        ${V_CO_Sm3 > 0 ? `<tr><td>CO (karbonmonoksit)</td><td>${V_CO_Sm3.toFixed(4)}</td><td>${yuzde(V_CO_Sm3, toplam_yas_Sm3)}</td><td>${yuzde(V_CO_Sm3, toplam_kuru_Sm3)}</td></tr>` : ''}
                        <tr class="highlight"><td>Toplam (yaş)</td><td>${toplam_yas_Sm3.toFixed(4)}</td><td>100%</td><td>-</td></tr>
                        <tr class="highlight"><td>Toplam (kuru)</td><td>${toplam_kuru_Sm3.toFixed(4)}</td><td>-</td><td>100%</td></tr>
                    </table>
                `;

                if (eksikYanma) {
                    html += `<div class="note">⚠️ Eksik yanma (λ<1) nedeniyle CO oluşmuştur.</div>`;
                }

                sonuclarDiv.innerHTML = html;
            }

            // Sayfa yüklendiğinde "Doğalgaz (standart 8250)" seçili olsun
            window.addEventListener('load', () => {
                const dogalgazBtn = document.querySelector('.yakit-buton[data-yakit="dogalgaz_dusuk"]');
                if (dogalgazBtn) {
                    dogalgazBtn.classList.add('aktif');
                    const veri = yakitlar['dogalgaz_dusuk'];
                    if (veri) {
                        cInp.value = veri.C.toFixed(1);
                        hInp.value = veri.H.toFixed(1);
                        oInp.value = veri.O.toFixed(1);
                        nInp.value = veri.N.toFixed(1);
                        sInp.value = veri.S.toFixed(1);
                        wInp.value = veri.W.toFixed(1);
                        kulInp.value = veri.kul.toFixed(1);
                        yogunlukInp.value = veri.yogunluk.toFixed(3);
                    }
                }
                yakitAnaliziHesapla();
            });
        })();
    </script>
</body>
</html>
